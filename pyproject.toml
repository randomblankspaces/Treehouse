[project]
name = "treehouse"
version = "0.1.0"
description = "Treehouse (Clay agent-eval sandbox): observe, check, score and estimate trust for agentic geospatial dataset builds"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "pyyaml>=6",
    "numpy>=2.0",
    "scipy>=1.13",
    "typer>=0.12",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]
mcp = ["mcp>=2.3,<3"]
strands = ["strands-agents>=1.60,<2"]
geo = ["rasterio>=1.4"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
treehouse = "treehouse.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "boto3>=1.35", "mcp>=2.3,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: needs real AWS/Bedrock (skipped unless TREEHOUSE_LIVE=1)",
    "allow_loopback: test may open sockets to 127.0.0.1",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
