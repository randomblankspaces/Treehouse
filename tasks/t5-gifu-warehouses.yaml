# T5 transfer, keyed. Same workflow as Nagoya, re-run in Gifu with NO new labels (DM2). Reference: PLATEAU.
schema_version: treehouse.task/1
id: t5-gifu-warehouses
version: 1.0.0
title: Warehouses in a Gifu industrial district (T5 transfer, keyed, no new labels)
family: warehouse-retrieval
synthetic: false
goal: >-
  Find every warehouse in the area of interest, using the same workflow you used before without collecting
  new training labels here. A warehouse is a warehouse or large logistics/storage building (roughly 1,600 m2
  of floor area or more). Do NOT count factories, markets, aircraft hangars or other large roofs. Return each
  warehouse as a point inside the building, with the resources and image windows you used and your confidence.
  State the resolution and cell size you chose and why, the area you searched, any area you could not review,
  and a count with a range. Note whether you expect the workflow to transfer from the training city.
aoi:   # ~9 x 7 km over the Gifu city industrial belt
  type: Polygon
  coordinates: [[[136.72, 35.38], [136.82, 35.38], [136.82, 35.45], [136.72, 35.45], [136.72, 35.38]]]
smoke_aoi: [136.72, 35.38, 136.77, 35.415]
time_window: [2024-01-01, 2024-12-31]
as_of: 2024-12-31T23:59:00Z
data_allowlist:
  - source_id: aef-10m-annual
    kind: embeddings
    access: s3_listing
    license: CC-BY-4.0
    status: unpinned
  - source_id: lgnd-clay-embeddings
    kind: embeddings
    access: s3_listing
    license: CC-BY-4.0
    status: unpinned
  - source_id: sentinel-2-l2a-cogs
    kind: imagery
    access: s3_listing
    license: LicenseRef-copernicus-sentinel
    status: unpinned
  - source_id: gsi-seamless-aerial-japan
    kind: imagery
    access: s3_listing
    license: LicenseRef-gsi-japan-attribution
    status: unpinned
tools_allowed:
  - record_decision
  - list_embedding_sources
  - build_index
  - get_examples
  - retrieve
  - classify
  - imagery_window
  - aggregate
  - record_claim
  - note_limitation
  - submit_understanding
needs_vision: true
classes:
  warehouse:
    min_size_m: 40
    max_effective_gsd_for_existence_m: 10
    max_effective_gsd_for_status_m: 10
    match_tolerance_m: 80
    key_geometry: point
windows: {max_side_m: 5000, max_out_px: 512, max_bytes_per_run: 500000000}
steps:
  - step_id: inventory
    question_id: exists
    statuses_allowed: [present, absent, cannot_assess]
    keying:
      mode: keyed
      key_source: PLATEAU 3D city model, Gifu, bldg:usage=warehouse (441), footprint >= 1,600 m2, clipped to AOI
      key_path: keys/plateau/gifu-warehouses.geojson
      version_hash: sha256:345cce8c3e189059babda9e7bd1481bdcee7c3415c9eddcb4c09f2e18c6b9594
      license: CC-BY-4.0
      reference_quality: complete
      match_rule: {tolerance_m: {warehouse: 80}, one_to_one: true}
      status: present
forbidden_sources:
  - {kind: path, pattern: keys/}
  - {kind: dataset_id, pattern: plateau-gifu-warehouses}
  - {kind: tool, pattern: key_lookup}
  - {kind: host, pattern: "*.maxar.com"}
  - {kind: dataset_id, pattern: maxar}
  - {kind: dataset_id, pattern: vantor}
must_notice:
  - {id: resolution, kind: mentions_any, terms: [10 m, resolution, gsd, cell size, 160 m]}
  - {id: transfer, kind: mentions_any, terms: [transfer, same workflow, no new labels, generalise, generalize]}
  - {id: count-range, kind: mentions_any, terms: [range, count, approximately, about]}
  - {id: uses-imagery, kind: plans_tool, tool: imagery_window}
known_limits:
  - "Transfer target: the report shows a large Nagoya -> Gifu transfer gap for warehouses."
  - Factories and markets are not warehouses (Table 8 negatives).
sampling_plan:
  strata_keys: [conf_tercile]
  n_total: 20
  seed: 20261105
thresholds: {rely_lo: 0.8}
budget: {enabled: true, usd: 15, tool_calls: 200, bytes: 500000000, wall_s: 1800, tokens: 3000000}
