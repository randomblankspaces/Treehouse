# T1 retrieval on REAL public LGND Clay v1.5 embeddings (source.coop, CC BY 4.0) + GSI aerial imagery for the vision
# sub-agent. Same AOI and goal as t1-nagoya-warehouses. Unkeyed here: the synthetic PLATEAU fixture must not grade a
# real-embedding run; an OSM warehouse pool (incomplete reference, precision-in-pool only) is attached grader-side.
# The worker sees goal + AOI + time window + tools only. Keys, known_limits and must_notice are grader-side.
schema_version: treehouse.task/1
id: t1-nagoya-warehouses-real
version: 1.0.0
title: Warehouses in a Nagoya port/logistics district (T1 retrieval, real Clay embeddings + GSI vision)
family: warehouse-retrieval
synthetic: false
goal: >-
  Find every warehouse in the area of interest. A warehouse is a warehouse or large logistics/storage
  building (roughly 1,600 m2 of floor area or more). Do NOT count factories, markets, aircraft hangars or
  other large roofs that are not warehouses. Return each warehouse as a point inside the building, with the
  resources and image windows you used and your confidence. State the resolution and cell size you chose and
  why, the area you searched, any area you could not review, and a count with a range.
aoi:   # ~10 x 8 km over Nagoya Port / Minato-ku
  type: Polygon
  coordinates: [[[136.82, 35.05], [136.92, 35.05], [136.92, 35.12], [136.82, 35.12], [136.82, 35.05]]]
smoke_aoi: [136.82, 35.05, 136.87, 35.085]
time_window: [2024-01-01, 2024-12-31]
as_of: 2024-12-31T23:59:00Z
data_allowlist:
  - source_id: aef-10m-annual
    kind: embeddings
    access: s3_listing
    license: CC-BY-4.0
    status: unpinned
  - source_id: lgnd-clay-embeddings
    kind: embeddings
    access: real
    license: CC-BY-4.0
    status: unpinned
  - source_id: sentinel-2-l2a-cogs
    kind: imagery
    access: s3_listing
    license: LicenseRef-copernicus-sentinel
    status: unpinned
  - source_id: gsi-seamless-aerial-japan
    kind: imagery
    access: s3_listing
    license: LicenseRef-gsi-japan-attribution
    status: unpinned
tools_allowed:
  - record_decision
  - list_embedding_sources
  - build_index
  - get_examples
  - retrieve
  - classify
  - imagery_window
  - aggregate
  - record_claim
  - note_limitation
  - submit_understanding
needs_vision: true
classes:
  warehouse:
    min_size_m: 40            # ~1,600 m2 => ~40 m side
    max_effective_gsd_for_existence_m: 10
    max_effective_gsd_for_status_m: 10
    match_tolerance_m: 80     # any-touch at the 160 m cell is handled by the grader; this is the point tol
    key_geometry: point
windows: {max_side_m: 5000, max_out_px: 512, max_bytes_per_run: 500000000}
steps:
  - step_id: inventory
    question_id: exists
    statuses_allowed: [present, absent, cannot_assess]
    keying:
      mode: unkeyed
      status: none
forbidden_sources:
  - {kind: path, pattern: keys/}
  - {kind: dataset_id, pattern: plateau-nagoya-warehouses}
  - {kind: tool, pattern: key_lookup}
  - {kind: host, pattern: securewatch.maxar.com}
  - {kind: host, pattern: "*.maxar.com"}
  - {kind: dataset_id, pattern: maxar}
  - {kind: dataset_id, pattern: vantor}
must_notice:
  - {id: resolution, kind: mentions_any, terms: [10 m, resolution, gsd, cell size, 160 m]}
  - {id: cell-merge, kind: mentions_any, terms: [merge, aggregate, site, cell]}
  - {id: count-range, kind: mentions_any, terms: [range, count, approximately, about]}
  - {id: uses-imagery, kind: plans_tool, tool: imagery_window}
known_limits:
  - Sentinel-2 / AEF are 10 m; warehouses are visible but small warehouses and look-alikes are the failure mode.
  - The precomputed LGND Clay index uses 1.28 / 2.56 km cells, far coarser than the 160 m unit of evaluation.
  - Factories and markets are not warehouses (Table 8 negatives).
sampling_plan:
  strata_keys: [conf_tercile]
  n_total: 40
  seed: 20261104
thresholds: {rely_lo: 0.8}
budget: {enabled: true, usd: 15, tool_calls: 200, bytes: 500000000, wall_s: 1800, tokens: 3000000}
