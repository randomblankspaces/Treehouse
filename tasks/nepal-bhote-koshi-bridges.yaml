known_limits:
  - Sixteen of the 21 post-event scenes over the AOI are 71-94 % cloud; B1300011011E5610 and B1300011011E5810 are the clear ones.
  - Footbridge decks are 1-2 m wide; status needs windows at 0.5 m effective GSD or finer.
  - Clay embeddings end in April 2026 and predate the flood; they can narrow the corridor, not show damage.
  - "Placebo control unavailable: 2 pre scenes, about 63 % of the AOI covered by both pre scenes, 3-5 year gap to the event. Test-retest uses E5610/E5810 only."
  - Model memory of OSM cannot be excluded by blocking tools.
  - Vantor imagery is CC-BY-NC-4.0; derived datasets are non-commercial.
