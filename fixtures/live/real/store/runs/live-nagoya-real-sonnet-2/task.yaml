goal: Find every warehouse in the area of interest. A warehouse is a warehouse or
  large logistics/storage building (roughly 1,600 m2 of floor area or more). Do NOT
  count factories, markets, aircraft hangars or other large roofs that are not warehouses.
  Return each warehouse as a point inside the building, with the resources and image
  windows you used and your confidence. State the resolution and cell size you chose
  and why, the area you searched, any area you could not review, and a count with
  a range.
gold_plan: null
id: t1-nagoya-warehouses-real
known_limits:
- Sentinel-2 / AEF are 10 m; warehouses are visible but small warehouses and look-alikes
  are the failure mode.
- The precomputed LGND Clay index uses 1.28 / 2.56 km cells, far coarser than the
  160 m unit of evaluation.
- Factories and markets are not warehouses (Table 8 negatives).
