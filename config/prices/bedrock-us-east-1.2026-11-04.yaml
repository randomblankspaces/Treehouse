# Bedrock on-demand prices, us-east-1, as of 2026-11-04. ALL NULL until Kiro fills them (K2a) from the
# Bedrock pricing page or `aws pricing get-products --service-code AmazonBedrock --region us-east-1`.
# A null price means UNPRICED: the SpendLedger refuses the call (except the K1 probe, AWS-B1).
#
# UNITS: USD per 1,000 tokens. Most pricing pages quote per 1M tokens: DIVIDE BY 1000
# (e.g. $3.00 per 1M input -> 0.003). Prices must be > 0 and inside a plausibility band
# (input 0.00001..0.2, output 0.00001..1.0 per 1K); `treehouse prices check` prints the $/1M back to you.
#
# ROWS ARE PER (model, inference profile): `<price_ref>@us` is the price when calling the `us.` profile,
# `@global` the `global.` profile. Geographic profiles (us./eu./apac.) can cost MORE (about +10% for recent
# Claude) than global.; copy the row for the profile config/models.yaml actually calls. If the page gives
# only one number and you cannot tell which profile it is for, put it in the @us row (the one we call) and,
# when two numbers disagree, use the MORE EXPENSIVE. The ledger uses the most expensive priced row
# (+10% for a geographic profile) when the exact row is null, so it never under-counts.
# Then run `uv run treehouse prices check`.
schema_version: treehouse.prices/1
version: bedrock-us-east-1.2026-11-04
region: us-east-1
currency: USD
unit: per_1k_tokens
source: "aws pricing get-products --service-code AmazonBedrockFoundationModels (servicename=Claude Sonnet 5.5 (Amazon Bedrock Edition), regionCode=us-east-1) and --service-code AmazonBedrock (model=Nova Pro, regionCode=us-east-1); on-demand standard tier"
retrieved: 2026-11-04
unit_source: "Claude rows quoted by the Pricing API per 1M tokens, divided by 1000 (usagetype ..._standard-Units = geographic/us. profile, ..._global_standard-Units = global. profile). Nova Pro rows quoted per 1K tokens, used as-is. Nova Pro has no on-demand cache-write price in the API, left null."
synthetic: false
estimated: false
models:
  # Haiku price not verified: Sonnet's geographic-profile rates are the lead-approved ceiling.
  claude-haiku-5-5@us: {input: 0.0022, output: 0.011, cache_read: 0.00011, cache_write: 0.00275, price_basis: ceiling}
  claude-sonnet-5-5@us: {input: 0.0022, output: 0.011, cache_read: 0.00011, cache_write: 0.00275}
  claude-sonnet-5-5@global: {input: 0.002, output: 0.01, cache_read: 0.0001, cache_write: 0.0025}
  nova-pro@us: {input: 0.0008, output: 0.0032, cache_read: 0.0002, cache_write: null}
